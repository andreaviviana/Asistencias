sonar.projectKey=andreaviviana_Asistencias
sonar.organization=andreaviviana

# Nombre del proyecto que se mostrará en SonarCloud
sonar.projectName=Asistencias
sonar.projectVersion=1.0

# 🚩 IMPORTANTE PARA PHP: DÓNDE BUSCAR EL CÓDIGO
# Indica que debe buscar los archivos de código fuente en la carpeta raíz (o donde estén tus archivos PHP).
# El punto (.) significa "la carpeta actual" (la raíz del repositorio).
sonar.sources=.

# Excluye archivos o carpetas que no son relevantes para el análisis (opcional, pero recomendado)
sonar.exclusions=**/*.html, **/*.css, **/*.js, vendor/**, node_modules/**

# Asegura que PHP sea el lenguaje principal
sonar.language=php

# Asegura la codificación
sonar.sourceEncoding=UTF-8